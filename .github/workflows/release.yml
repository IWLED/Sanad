name: Release APK for Obtainium

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Artifacts
        id: prep
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ "$TAG" != v* ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Sanad.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/Sanad-${TAG}.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.TAG }}
          name: Sanad ${{ steps.prep.outputs.TAG }}
          body: |
            ## 📱 تحديث تطبيق سند (Sanad AI Secretary)
            
            - **الإصدار:** `${{ steps.prep.outputs.TAG }}`
            - **التوافق:** متوافق مع التحديث التلقائي عبر **Obtainium**.
            
            ### 📥 التثبيت عبر Obtainium:
            1. أضف رابط المستودع في تطبيق Obtainium:
               `https://github.com/${{ github.repository }}`
            2. سيتم جلب ملف `Sanad.apk` وتحديثه تلقائياً عند أي إصدار جديد.
            
            ### الملفات المرفقة:
            - `Sanad.apk` (التطبيق الرئيسي المباشر)
            - `Sanad-${{ steps.prep.outputs.TAG }}.apk` (نسخة موسومة برقم الإصدار)
          draft: false
          prerelease: false
          files: |
            release-artifacts/Sanad.apk
            release-artifacts/Sanad-${{ steps.prep.outputs.TAG }}.apk
