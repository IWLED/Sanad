name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  server-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: server
        run: uv sync --frozen

      - name: Ruff Lint and Format check
        working-directory: server
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy Type Check
        working-directory: server
        run: uv run mypy app

      - name: Run Pytest (Unit, Security, Contract)
        working-directory: server
        run: uv run pytest
