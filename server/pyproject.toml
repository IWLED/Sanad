[project]
name = "sanad-server"
version = "0.1.0"
description = "خادم السكرتير الشخصي الذكي (Sanad AI Secretary Server)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.8",
    "greenlet>=3.1.1",
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "openai==3.51.0",
    "apscheduler==3.11.3",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
    "phonenumbers==9.0.43",
    "structlog==26.1.0",
    "websockets==17.4",
    "python-multipart>=0.0.33",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "hypothesis==6.170.15",
    "respx==0.23.1",
    "types-pyyaml>=6.0.12",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
